services:
  linux:
    build: ./linux
    image: basic-linux:1.0
    environment:
      APP_MODE: "${APP_MODE:-compose}"
      PORT: "8080"
    volumes:
      - practice-data:/data

  web:
    build: ./web
    image: basic-web:1.0
    depends_on:
      - linux
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - "${LOG_DIR:-./logs}:/logs"

volumes:
  practice-data:
    external: true